name = "campus-wall-api"
main = "server/worker.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# 非敏感配置
PG_POOL_MAX = "5"

# 以下敏感值通过 `wrangler secret put` 注入：
