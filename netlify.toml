[build]
  # 函数产物已提交在仓库中（netlify/functions/api.js），构建时只需构建前端
  command = "npm --prefix client ci --no-audit --no-fund && npm --prefix client run build"
  publish = "client/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  UPLOADS_DIR = "/tmp/uploads"

# API 请求转发到 Serverless 函数
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "/.netlify/functions/api/uploads/:splat"
  status = 200
  force = true

# 其余请求交给前端 SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 入口 HTML 不缓存，保证 WebIntoApp 打包的 APK 每次打开/刷新都能拿到最新版本
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# 带 hash 的静态资源可以长期缓存
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
